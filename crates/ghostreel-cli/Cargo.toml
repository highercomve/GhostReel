[package]
name = "ghostreel-cli"
description = "GhostReel headless CLI"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ghostreel"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
ghostreel-core = { path = "../ghostreel-core" }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "io-std", "io-util"] }
