[package]
name = "ghostreel-core"
description = "GhostReel core: config, index database, AI backend probing, doctor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
blake3 = "1.8.7"
dirs = "7.0.0"
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
notify = "8.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
quick-xml = "0.42"
sqlite-vec = "0.1.9"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "process", "net", "io-util", "sync", "fs"] }
toml = "1.1.6"
tracing = "0.1.44"
walkdir = "2.5.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
