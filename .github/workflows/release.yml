name: Release

# Build the GhostReel bundles (CUDA helpers included) and publish them to ONE GitHub Release,
# the same shape as GhostPen's release.yml:
#   1. create-release  -> one draft release for the tag (reused on re-runs)
#   2. linux-x64 / windows-x64 / macos -> build and upload their bundles into that draft by id
#      (the API can't find draft releases by tag, so each job would otherwise make its own)
#   3. publish-release -> flip the draft to published once every platform uploaded
#
# Trigger: push a tag like `v0.1.1`, or run manually with a tag input.
#
# Pushes to master that touch the Rust build run the same jobs without bundling or publishing,
# only to fill the caches: GitHub scopes a cache to the ref that saved it, and a tag can read
# only its own and the default branch's. A cache saved by a tag is useless to the next tag
# (every release rebuilt the CUDA helpers, ~30 min on Linux), so tags only restore.

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
    paths:
      - 'crates/**'
      - 'src-tauri/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'scripts/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish under (e.g. v0.1.1). Created if it doesn't exist."
        required: true
        default: "v0.0.0-dev"
      runner:
        description: "Where to build. github: free for public repos, 4 cores. blacksmith: 16 cores, spends Blacksmith credits (a 16-vCPU minute costs 8 free minutes; Windows more)."
        type: choice
        options: [github, blacksmith]
        default: github

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  # A cancelled cache run saves nothing: let it finish, the next one queues.
  cancel-in-progress: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}

env:
  # 'true' for a release (a tag or a manual run), 'false' for a cache run on master.
  RELEASE: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}

permissions:
  contents: write

jobs:
  create-release:
    name: Create release
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Create draft release
        id: create
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner, repo: context.repo.repo,
            });
            const existing = releases.find((r) => r.tag_name === tag);
            if (existing) { core.info(`Reusing release ${existing.id} for ${tag}`); return existing.id; }
            // The release notes are this version's section of CHANGELOG.md, when it has one:
            // "## [0.1.6] — date" up to the next "## ". The download line stays on top.
            const fs = require("fs");
            let notes = "";
            try {
              const version = tag.replace(/^v/, "");
              const log = fs.readFileSync("CHANGELOG.md", "utf8");
              const m = log.match(new RegExp(`^## \\[${version.replace(/\./g, "\\.")}\\][^\n]*\n([\\s\\S]*?)(?=^## |(?![\\s\\S]))`, "m"));
              if (m) notes = m[1].trim();
            } catch (e) { core.warning(`no CHANGELOG.md section for ${tag}: ${e.message}`); }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              tag_name: tag, target_commitish: context.sha, name: `GhostReel ${tag}`,
              body: [
                "**Windows:** `GhostReel_*_x64-setup.exe` · **Linux:** `.AppImage` · **macOS:** `.dmg` (Apple Silicon / Intel) · **CLI only:** `ghostreel-cli-*`.",
                "",
                "Linux/Windows GPU acceleration needs an NVIDIA driver 570+ (CUDA 12.8 runtime is bundled). macOS uses Metal. On first start open **Models** and download the models.",
                "",
                "macOS builds use a self-signed certificate. Drag GhostReel to Applications; on first launch approve it in System Settings → Privacy & Security → Open Anyway.",
                ...(notes ? ["", "---", "", notes] : []),
              ].join("\n"),
              draft: true, prerelease: false,
            });
            return data.id;
  # Default to GitHub's runners: unlimited and free on a public repo. The CUDA helpers are cached,
  # so a release is ~20 min there; pick the blacksmith runner only when a helper rebuild needs speed.
  linux-x64:
    name: linux-x64
    needs: create-release
    # Also when create-release is skipped (a cache run).
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    runs-on: ${{ github.event.inputs.runner == 'blacksmith' && 'blacksmith-16vcpu-ubuntu-2204' || 'ubuntu-22.04' }}
    timeout-minutes: 240
    env:
      CMAKE_CUDA_ARCHITECTURES: "86;89"
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ github.event.inputs.runner == 'blacksmith' && '16' || '4' }}
      GHOSTREEL_GPU: cuda
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libfuse2 \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            xz-utils \

      # Jimver pin v0.2.24 checked to exist; CUDA 12.8 ships .so.12 / 64_12.dll runtimes
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: "12.8.1"
          method: network
          # driver-dev ships the libcuda.so link stub the AppImage step needs (no driver on the runner).
          sub-packages: '["nvcc","cudart","cudart-dev","driver-dev"]'
          # cuBLAS is packaged as libcublas-12-8 on apt, not cuda-cublas-12-8.
          non-cuda-sub-packages: '["libcublas","libcublas-dev"]'
          use-github-cache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-cuda
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # The CUDA helpers take most of the build time: reuse them until their code, Cargo.lock,
      # the CUDA version or the GPU architectures change.
      # Only the llama.cpp / whisper.cpp crate versions matter for the helpers, not the whole
      # Cargo.lock (a version bump of the workspace would otherwise rebuild them every release).
      - name: Helper dependency hash
        id: helper-deps
        shell: bash
        run: echo "hash=$(grep -A1 -E '^name = "(llama-cpp-2|llama-cpp-sys-2|whisper-rs|whisper-rs-sys)"$' Cargo.lock | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore CUDA helpers
        id: helpers
        uses: actions/cache/restore@v4
        with:
          path: |
            target/release/ghostreel-asr
            target/release/ghostreel-llm
          key: helpers-linux-x64-cuda12.8.1-${{ env.CMAKE_CUDA_ARCHITECTURES }}-${{ hashFiles('crates/ghostreel-asr/**', 'crates/ghostreel-llm/**', 'scripts/build-helpers.sh') }}-${{ steps.helper-deps.outputs.hash }}

      - name: Build native helpers
        if: steps.helpers.outputs.cache-hit != 'true'
        run: scripts/build-helpers.sh asr llm
        env:
          JOBS: ${{ github.event.inputs.runner == 'blacksmith' && '16' || '4' }}

      - name: Save CUDA helpers
        if: steps.helpers.outputs.cache-hit != 'true' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: |
            target/release/ghostreel-asr
            target/release/ghostreel-llm
          key: ${{ steps.helpers.outputs.cache-primary-key }}

      - name: Build CLI
        run: cargo build --release -p ghostreel-cli

      - name: Fetch sidecars
        run: node scripts/fetch-sidecars.mjs

      - name: Stage helpers
        run: node scripts/stage-helpers.mjs --cuda

      - name: Helper diagnostics
        run: |
          ldd src-tauri/binaries/ghostreel-asr-x86_64-unknown-linux-gnu
          readelf -d src-tauri/binaries/ghostreel-asr-x86_64-unknown-linux-gnu | grep RUNPATH
          readelf -d src-tauri/binaries/ghostreel-llm-x86_64-unknown-linux-gnu | grep RUNPATH

      # linuxdeploy must resolve every library the helpers link, including libcuda.so.1, which
      # only an NVIDIA driver provides. Point it at the toolkit's stub; fix-appimage.sh then
      # removes libcuda from the AppImage so the user's own driver is used at runtime.
      # A cache run compiles exactly what the bundle build compiles, without bundling.
      - name: Build the app (cache run)
        if: env.RELEASE != 'true'
        run: npx tauri build --config src-tauri/tauri.bundle.json --no-bundle

      - name: Build Tauri bundles
        if: env.RELEASE == 'true'
        run: |
          stub=$(find "$CUDA_PATH" -path '*stubs/libcuda.so' | head -n1)
          test -n "$stub" || { echo "::error::CUDA libcuda.so stub not found under $CUDA_PATH"; exit 1; }
          mkdir -p "$RUNNER_TEMP/cuda-stub"
          ln -sf "$stub" "$RUNNER_TEMP/cuda-stub/libcuda.so.1"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/cuda-stub${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          npx tauri build --config src-tauri/tauri.bundle.json --bundles appimage --verbose
        env:
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Fix AppImage (drop driver libs, dedupe CUDA libs, repack)
        if: env.RELEASE == 'true'
        run: scripts/fix-appimage.sh

      # Repacking changes the file, so Tauri's signature from the build no longer matches: sign again.
      - name: Re-sign the AppImage for the updater
        if: env.RELEASE == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          shopt -s nullglob
          for img in target/release/bundle/appimage/*.AppImage; do
            # -p "": the key has no password, and without this the CLI tries to prompt.
            npx tauri signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" -p "" "$img"
          done

      - name: Package CLI
        if: env.RELEASE == 'true'
        run: scripts/package-cli.sh

      - name: Upload artifacts
        if: env.RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ghostreel-linux-x64
          path: |
            target/release/bundle/appimage/*.AppImage
            target/dist/*.tar.gz

      # One file at a time with retries (large parallel uploads time out). CLI tarball stays in artifacts.
      - name: Upload bundles to the release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          shopt -s nullglob
          files=(target/release/bundle/appimage/*.AppImage)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no bundles found"; exit 1; }
          for f in "${files[@]}"; do
            for i in 1 2 3; do
              echo "uploading $(basename "$f") ($(du -m "$f" | cut -f1) MB), attempt $i"
              # A stalled upload otherwise hangs the job for hours instead of retrying.
              timeout 20m gh release upload "$TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY" && break
              [ "$i" = 3 ] && { echo "::error::upload of $f failed"; exit 1; }
              sleep 15
            done
          done
          # Upload .sig files (updater signatures) as release assets.
          shopt -s nullglob
          for sig in target/release/bundle/appimage/*.AppImage.sig; do
            gh release upload "$TAG" "$sig" --clobber --repo "$GITHUB_REPOSITORY" || true
          done

      - name: Write updater snippet
        if: env.RELEASE == 'true'
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          shopt -s nullglob
          appimages=(target/release/bundle/appimage/*.AppImage)
          [ ${#appimages[@]} -gt 0 ] || { echo "::error::no AppImage found for updater snippet"; exit 1; }
          appimage="${appimages[0]}"
          assetName="$(basename "$appimage")"
          sigFile="${appimage}.sig"
          sig=""
          if [ -f "$sigFile" ]; then
            sig="$(cat "$sigFile")"
          fi
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${assetName}"
          mkdir -p target/updater
          jq -n --arg s "$sig" --arg u "$url" \
            '{platform: "linux-x86_64", signature: $s, url: $u}' > target/updater/updater-linux.json
          cat target/updater/updater-linux.json

      - name: Upload updater snippet
        if: env.RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updater-linux
          path: target/updater/updater-linux.json

  windows-x64:
    name: windows-x64
    needs: create-release
    # Also when create-release is skipped (a cache run).
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    runs-on: ${{ github.event.inputs.runner == 'blacksmith' && 'blacksmith-16vcpu-windows-2025' || 'windows-2022' }}
    timeout-minutes: 240
    env:
      CMAKE_CUDA_ARCHITECTURES: "86;89"
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ github.event.inputs.runner == 'blacksmith' && '16' || '4' }}
      GHOSTREEL_GPU: cuda
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Jimver pin v0.2.24 checked to exist; CUDA 12.8 ships .so.12 / 64_12.dll runtimes
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: "12.8.1"
          method: network
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","visual_studio_integration"]'
          use-github-cache: false

      # whisper-rs / llama-cpp-2 bindgen needs libclang.
      - name: libclang for bindgen
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) { choco install llvm --no-progress -y }
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-cuda
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Reuse the CUDA helpers until their code, Cargo.lock, CUDA or the GPU architectures change.
      # Only the llama.cpp / whisper.cpp crate versions matter for the helpers, not the whole
      # Cargo.lock (a version bump of the workspace would otherwise rebuild them every release).
      - name: Helper dependency hash
        id: helper-deps
        shell: bash
        run: echo "hash=$(grep -A1 -E '^name = "(llama-cpp-2|llama-cpp-sys-2|whisper-rs|whisper-rs-sys)"$' Cargo.lock | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore CUDA helpers
        id: helpers
        uses: actions/cache/restore@v4
        with:
          path: |
            target/release/ghostreel-asr.exe
            target/release/ghostreel-llm.exe
          key: helpers-windows-x64-cuda12.8.1-${{ env.CMAKE_CUDA_ARCHITECTURES }}-${{ hashFiles('crates/ghostreel-asr/**', 'crates/ghostreel-llm/**', 'scripts/build-helpers.sh') }}-${{ steps.helper-deps.outputs.hash }}

      - name: Build helper ghostreel-asr
        if: steps.helpers.outputs.cache-hit != 'true'
        shell: pwsh
        run: cargo build -j ${{ github.event.inputs.runner == 'blacksmith' && '16' || '4' }} --release -p ghostreel-asr --features cuda

      - name: Build helper ghostreel-llm
        if: steps.helpers.outputs.cache-hit != 'true'
        shell: pwsh
        run: cargo build -j ${{ github.event.inputs.runner == 'blacksmith' && '16' || '4' }} --release -p ghostreel-llm --features cuda

      - name: Save CUDA helpers
        if: steps.helpers.outputs.cache-hit != 'true' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: |
            target/release/ghostreel-asr.exe
            target/release/ghostreel-llm.exe
          key: ${{ steps.helpers.outputs.cache-primary-key }}

      - name: Build CLI
        shell: pwsh
        run: cargo build --release -p ghostreel-cli

      - name: Fetch sidecars
        run: node scripts/fetch-sidecars.mjs

      - name: Stage helpers
        run: node scripts/stage-helpers.mjs --cuda

      - name: Build the app (cache run)
        if: env.RELEASE != 'true'
        run: npx tauri build --config src-tauri/tauri.bundle.json --no-bundle

      - name: Build Tauri NSIS bundle
        if: env.RELEASE == 'true'
        run: npx tauri build --config src-tauri/tauri.bundle.json --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Package Windows CLI zip
        if: env.RELEASE == 'true'
        shell: pwsh
        run: |
          $stageDir = "target/dist/ghostreel-cli-windows-x64"
          if (Test-Path $stageDir) { Remove-Item -Recurse -Force $stageDir }
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          Copy-Item "target/release/ghostreel.exe" -Destination $stageDir

          Get-ChildItem -Path "src-tauri/binaries/*-x86_64-pc-windows-msvc.exe" | ForEach-Object {
            $destName = $_.Name -replace '-x86_64-pc-windows-msvc', ''
            Copy-Item $_.FullName -Destination (Join-Path $stageDir $destName)
          }

          if (Test-Path "src-tauri/lib/*.dll") {
            Copy-Item "src-tauri/lib/*.dll" -Destination $stageDir
          }

          Compress-Archive -Path $stageDir -DestinationPath "target/dist/ghostreel-cli-windows-x64.zip" -Force

      - name: Upload artifacts
        if: env.RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ghostreel-windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/dist/ghostreel-cli-windows-x64.zip

      # One file at a time with retries: parallel 700 MB uploads from the runner time out (HTTP 400).
      # The CLI zip (same CUDA DLLs again) stays in the run's artifacts, not the release.
      - name: Upload installer to the release
        if: env.RELEASE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $files = @(Get-ChildItem -Path target/release/bundle/nsis/*-setup.exe)
          if ($files.Count -eq 0) { throw "no installer found" }
          foreach ($f in $files) {
            for ($i = 1; $i -le 3; $i++) {
              Write-Host "uploading $($f.Name) ($([math]::Round($f.Length/1MB)) MB), attempt $i"
              $job = Start-Job { gh release upload $using:env:TAG $using:f.FullName --clobber --repo $using:env:GITHUB_REPOSITORY }
              if (-not (Wait-Job $job -Timeout 1200)) { Stop-Job $job; Write-Host "upload timed out" }
              Receive-Job $job | Out-Host
              if ($job.State -eq "Completed") { break }
              if ($i -eq 3) { throw "upload of $($f.Name) failed" }
              Start-Sleep -Seconds 15
            }
          }
          # Upload .sig files (updater signatures) as release assets.
          Get-ChildItem -Path target/release/bundle/nsis/*.sig -ErrorAction SilentlyContinue | ForEach-Object {
            gh release upload $env:TAG $_.FullName --clobber --repo $env:GITHUB_REPOSITORY
          }

      - name: Write updater snippet
        if: env.RELEASE == 'true'
        shell: pwsh
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $exes = @(Get-ChildItem -Path target/release/bundle/nsis/*-setup.exe)
          if ($exes.Count -eq 0) { throw "no NSIS installer found for updater snippet" }
          $exe = $exes[0]
          $sigFile = "$($exe.FullName).sig"
          $sig = ""
          if (Test-Path $sigFile) { $sig = Get-Content $sigFile -Raw | ForEach-Object { $_.Trim() } }
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/$($exe.Name)"
          New-Item -ItemType Directory -Force -Path target/updater | Out-Null
          $snippet = [ordered]@{ platform = "windows-x86_64"; signature = $sig; url = $url }
          $snippet | ConvertTo-Json | Set-Content target/updater/updater-windows.json
          Get-Content target/updater/updater-windows.json

      - name: Upload updater snippet
        if: env.RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updater-windows
          path: target/updater/updater-windows.json

  macos:
    name: macos-${{ matrix.arch }}
    needs: create-release
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            triple: aarch64-apple-darwin
            updater: darwin-aarch64
          - runner: macos-15-intel
            arch: x64
            triple: x86_64-apple-darwin
            updater: darwin-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      GHOSTREEL_GPU: metal
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
      JOBS: '3'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install native build tools
        run: brew install cmake ninja

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify native target
        run: |
          rustc -vV | grep -Fx 'host: ${{ matrix.triple }}'

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-${{ matrix.arch }}-metal
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Metal helpers
        run: scripts/build-helpers.sh

      - name: Build CLI
        run: cargo build --release -p ghostreel-cli

      - name: Fetch sidecars
        run: node scripts/fetch-sidecars.mjs

      - name: Stage helpers
        run: node scripts/stage-helpers.mjs

      - name: Check standalone sidecars
        run: scripts/check-macos-sidecars.sh '${{ matrix.triple }}'

      - name: Import persistent self-signed certificate
        if: env.RELEASE == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: scripts/macos-signing.sh import

      - name: Build the app (cache run)
        if: env.RELEASE != 'true'
        run: npx tauri build --config src-tauri/tauri.bundle.json --no-bundle

      - name: Build signed app and DMG
        if: env.RELEASE == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npx tauri build --config src-tauri/tauri.bundle.json --bundles app,dmg --verbose

      - name: Verify app and installer signatures
        if: env.RELEASE == 'true'
        run: |
          codesign --verify --deep --strict --verbose=2 target/release/bundle/macos/GhostReel.app
          shopt -s nullglob
          dmgs=(target/release/bundle/dmg/*.dmg)
          [ ${#dmgs[@]} -gt 0 ] || { echo 'No DMG produced' >&2; exit 1; }
          for dmg in "${dmgs[@]}"; do
            codesign --verify --strict --verbose=2 "$dmg"
          done
        shell: bash

      - name: Upload artifacts
        if: env.RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ghostreel-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig

      - name: Upload bundles to the release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          shopt -s nullglob
          # Tauri calls both updater archives GhostReel.app.tar.gz; give each arch a unique asset.
          archive=target/release/bundle/macos/GhostReel.app.tar.gz
          test -s "$archive"
          test -s "$archive.sig"
          asset="GhostReel_${{ matrix.arch }}.app.tar.gz"
          cp "$archive" "target/release/bundle/macos/$asset"
          cp "$archive.sig" "target/release/bundle/macos/$asset.sig"
          files=(target/release/bundle/dmg/*.dmg "target/release/bundle/macos/$asset" "target/release/bundle/macos/$asset.sig")
          for file in "${files[@]}"; do
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$file" --clobber --repo "$GITHUB_REPOSITORY"; then break; fi
              [ "$attempt" -lt 3 ] || exit 1
              sleep 10
            done
          done
          mkdir -p target/updater
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import fs from "node:fs";
            const signature = fs.readFileSync("target/release/bundle/macos/GhostReel.app.tar.gz.sig", "utf8").trim();
            const url = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.TAG}/GhostReel_${{ matrix.arch }}.app.tar.gz`;
            fs.writeFileSync("target/updater/updater-macos-${{ matrix.arch }}.json",
              JSON.stringify({platform: "${{ matrix.updater }}", signature, url}));
          '
        shell: bash

      - name: Upload updater snippet
        if: env.RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updater-macos-${{ matrix.arch }}
          path: target/updater/updater-macos-${{ matrix.arch }}.json
          if-no-files-found: error

      - name: Clean up signing keychain
        if: always() && env.RELEASE == 'true'
        timeout-minutes: 2
        continue-on-error: true
        run: scripts/macos-signing.sh cleanup

  publish-release:
    name: Publish release
    needs: [create-release, linux-x64, windows-x64, macos]
    # Do not publish a macOS release until both Mac installers and updater payloads are ready.
    if: always() && needs.create-release.result == 'success' && needs.macos.result == 'success' && (needs.linux-x64.result == 'success' || needs.windows-x64.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - name: Download Linux updater snippet
        if: needs.linux-x64.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: updater-linux
          path: updater-snippets
        continue-on-error: true

      - name: Download Windows updater snippet
        if: needs.windows-x64.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: updater-windows
          path: updater-snippets
        continue-on-error: true

      - name: Download macOS updater snippets
        uses: actions/download-artifact@v4
        with:
          pattern: updater-macos-*
          path: updater-snippets
          merge-multiple: true
        continue-on-error: true

      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          export version="${TAG#v}"
          pub_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export pub_date
          export notes="GhostReel ${TAG}"
          shopt -s nullglob
          snippets=(updater-snippets/*.json)
          platforms='{}'
          if [ ${#snippets[@]} -gt 0 ]; then
            platforms=$(jq -s 'map({(.platform): {signature: .signature, url: .url}}) | add' "${snippets[@]}")
          fi
          jq -n --arg v "$version" --arg n "$notes" --arg d "$pub_date" --argjson p "$platforms" \
            '{version: $v, notes: $n, pub_date: $d, platforms: $p}' > latest.json
          cat latest.json
        shell: bash

      - name: Upload latest.json to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"

      - name: Flip draft to published
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID), draft: false,
            });

