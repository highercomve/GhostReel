name: Check

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            xz-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build frontend
        run: npm ci && npm run build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --exclude ghostreel-asr --exclude ghostreel-llm --all-targets -- -D warnings

      - name: Test core crate
        run: cargo test -p ghostreel-core

      - name: Build CLI
        run: cargo build -p ghostreel-cli

  scripts:
    name: Scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check JavaScript scripts
        run: |
          for f in scripts/*.mjs; do
            [ -e "$f" ] || continue
            echo "Checking $f..."
            node --check "$f"
          done

      - name: Test packaging scripts
        run: node --test scripts/*.test.mjs

      - name: Check shell scripts
        run: |
          for f in scripts/*.sh; do
            [ -e "$f" ] || continue
            echo "Checking $f..."
            bash -n "$f"
          done

      - name: Parse JSON configs
        run: |
          # shellcheck disable=SC2016
          node -e '
            const fs = require("fs");
            const files = [
              "scripts/sidecars.json",
              ...fs.readdirSync("src-tauri").filter(f => f.endsWith(".json")).map(f => `src-tauri/${f}`)
            ];
            for (const file of files) {
              console.log(`Parsing ${file}...`);
              JSON.parse(fs.readFileSync(file, "utf8"));
            }
            console.log("JSON parse ok");
          '

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            triple: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x64
            triple: x86_64-apple-darwin
    env:
      GHOSTREEL_GPU: metal
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
      JOBS: '3'
    steps:
      - uses: actions/checkout@v7
      - name: Install native build tools
        run: brew install cmake ninja
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-${{ matrix.arch }}-metal
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build Metal helpers
        run: scripts/build-helpers.sh
      - name: Fetch and stage sidecars
        run: npm run sidecars
      - name: Check standalone sidecars
        run: scripts/check-macos-sidecars.sh '${{ matrix.triple }}'
      - name: Build macOS app
        # PR builds exercise bundling and nested signatures without release secrets.
        run: npx tauri build --config src-tauri/tauri.bundle.json --config '{"bundle":{"createUpdaterArtifacts":false}}' --bundles app,dmg
      - name: Verify app signature
        run: codesign --verify --deep --strict --verbose=2 target/release/bundle/macos/GhostReel.app
