name: Check

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            xz-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build frontend
        run: npm ci && npm run build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --exclude ghostreel-asr --exclude ghostreel-llm --all-targets -- -D warnings

      - name: Test core crate
        run: cargo test -p ghostreel-core

      - name: Build CLI
        run: cargo build -p ghostreel-cli

  scripts:
    name: Scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check JavaScript scripts
        run: |
          for f in scripts/*.mjs; do
            [ -e "$f" ] || continue
            echo "Checking $f..."
            node --check "$f"
          done

      - name: Check shell scripts
        run: |
          for f in scripts/*.sh; do
            [ -e "$f" ] || continue
            echo "Checking $f..."
            bash -n "$f"
          done

      - name: Parse JSON configs
        run: |
          node -e '
            const fs = require("fs");
            const files = [
              "scripts/sidecars.json",
              ...fs.readdirSync("src-tauri").filter(f => f.endsWith(".json")).map(f => `src-tauri/${f}`)
            ];
            for (const file of files) {
              console.log(`Parsing ${file}...`);
              JSON.parse(fs.readFileSync(file, "utf8"));
            }
            console.log("JSON parse ok");
          '
