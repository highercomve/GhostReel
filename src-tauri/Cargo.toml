[package]
name = "ghostreel-app"
description = "GhostReel — search inside your videos, locally"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# `_lib` keeps the lib name distinct from the bin (cargo#8519 on Windows).
name = "ghostreel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ghostreel-core = { path = "../crates/ghostreel-core" }
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1.53.1", features = ["net", "rt", "sync", "macros"] }
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "query"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tower = "0.5.3"
base64 = "0.22.1"
futures-util = { version = "0.3.34", default-features = false }

